<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26303A">
<title>Rodagem</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rodagem">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --asfalto:#26303A; --asfalto2:#34404C; --fundo:#ECEFF2; --papel:#FFFFFF;
  --tinta:#1F262D; --cinza:#66717D; --linha:#D8DEE4; --sinal:#F2B705;
  --lucro:#1F8A50; --gasto:#C83E3E;
  --num:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --txt:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--txt);background:var(--fundo);color:var(--tinta);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sinal);outline-offset:2px}
.hide{display:none!important}

/* topo */
header.topo{background:var(--asfalto);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;position:sticky;top:0;z-index:20}
.topo-linha{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px}
.marca{font-family:var(--num);font-weight:700;font-size:1.35rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.marca i{display:inline-block;width:10px;height:22px;background:repeating-linear-gradient(var(--sinal) 0 6px,transparent 6px 10px)}
.abas{display:none;gap:4px;margin-left:16px}
.abas button{background:none;border:0;color:#C9D1D8;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.abas button[aria-current="true"]{color:#fff;background:var(--asfalto2)}
.topo-acoes{margin-left:auto;display:flex;gap:8px}
.btn-icone{background:var(--asfalto2);border:0;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.9rem;font-weight:500}
.periodo{max-width:1100px;margin:12px auto 0;display:flex;gap:4px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.periodo button{flex:1 0 auto;background:transparent;border:1px solid #4A5662;color:#C9D1D8;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:.92rem}
.periodo button[aria-pressed="true"]{background:var(--sinal);border-color:var(--sinal);color:var(--asfalto)}

.aviso-demo{background:#FFF6D6;color:#5C4A00;font-size:.88rem;padding:8px 16px;text-align:center}

main{max-width:1132px;margin:0 auto;padding:20px 16px calc(110px + env(safe-area-inset-bottom,0px))}

/* destaque do painel */
.estrada{background:var(--asfalto);color:#fff;border-radius:14px;padding:22px 20px 0;overflow:hidden}
.estrada p{margin:0;color:#C9D1D8;font-size:.95rem}
.estrada .lucro{font-family:var(--num);font-weight:700;font-size:clamp(2.6rem,9vw,4rem);line-height:1.05;margin:4px 0 14px;font-variant-numeric:tabular-nums}
.estrada .lucro.neg{color:#FF9C9C}
.estrada .partes{display:flex;gap:28px;flex-wrap:wrap;padding-bottom:18px}
.estrada .partes span{display:block;font-size:.85rem;color:#AEB8C2}
.estrada .partes b{font-family:var(--num);font-size:1.35rem;font-weight:600}
.faixa{height:8px;margin:0 -20px;background:repeating-linear-gradient(90deg,var(--sinal) 0 34px,transparent 34px 58px);background-color:var(--asfalto2)}

.metricas{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.metrica{background:var(--papel);border-radius:10px;padding:14px 16px;border:1px solid var(--linha)}
.metrica span{display:block;color:var(--cinza);font-size:.88rem}
.metrica b{font-family:var(--num);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.metrica small{display:block;color:var(--cinza);font-size:.82rem;min-height:1.2em}

.bloco{background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:16px;margin-top:16px}
.bloco h2{font-size:1.05rem;margin:0 0 12px;font-weight:600}
.grafico{position:relative;height:240px}
.duas{display:grid;gap:16px}
.duas .bloco{margin-top:0}
.duas{margin-top:16px}

.barra-lista{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.barra-lista li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:.95rem}
.barra-lista .trilho{grid-column:1/-1;height:6px;background:var(--fundo);border-radius:3px;overflow:hidden}
.barra-lista .trilho i{display:block;height:100%;border-radius:3px}
.valor{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}

.vazio{color:var(--cinza);text-align:center;padding:28px 12px}
.vazio button{margin-top:10px}

/* listas */
.lista-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.lista-topo h1{font-size:1.4rem;margin:0;font-weight:700}
.lista-topo .total{text-align:right}
.lista-topo .total span{display:block;color:var(--cinza);font-size:.85rem}
.lista-topo .total b{font-family:var(--num);font-size:1.6rem;font-weight:700}
.itens{list-style:none;margin:0;padding:0;background:var(--papel);border:1px solid var(--linha);border-radius:10px;overflow:hidden}
.itens li+li{border-top:1px solid var(--linha)}
.itens button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 16px;cursor:pointer}
.itens button:hover{background:#F6F8FA}
.itens button:focus-visible{outline:3px solid var(--sinal);outline-offset:-3px}
.dia{font-family:var(--num);text-align:center;line-height:1.1;color:var(--cinza)}
.dia b{display:block;font-size:1.4rem;color:var(--tinta)}
.itens .t{font-weight:600}
.itens .s{color:var(--cinza);font-size:.88rem}
.pos{color:var(--lucro)} .negv{color:var(--gasto)}

/* navegação inferior (celular) */
nav.baixo{position:fixed;left:0;right:0;bottom:0;background:var(--papel);border-top:1px solid var(--linha);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.baixo button{background:none;border:0;padding:10px 4px 12px;color:var(--cinza);font-size:.8rem;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav.baixo svg{width:22px;height:22px}
nav.baixo button[aria-current="true"]{color:var(--asfalto);font-weight:700}
nav.baixo button[aria-current="true"] svg{color:var(--asfalto)}
nav.baixo button[aria-current="true"]::after{content:"";width:22px;height:3px;background:var(--sinal);border-radius:2px;margin-top:-1px}

.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--sinal);color:var(--asfalto);font-size:2rem;line-height:1;box-shadow:0 6px 18px rgba(38,48,58,.28);cursor:pointer;z-index:21}

.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:600;cursor:pointer}
.btn-pri{background:var(--asfalto);color:#fff}
.btn-sec{background:var(--fundo);color:var(--tinta)}
.btn-del{background:none;color:var(--gasto);padding-left:0}

/* formulário */
dialog{border:0;padding:0;border-radius:16px 16px 0 0;width:100%;max-width:560px;margin:auto auto 0;max-height:92vh;background:var(--papel);color:var(--tinta)}
dialog::backdrop{background:rgba(31,38,45,.55)}
.form-cab{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--linha);position:sticky;top:0;background:var(--papel);z-index:1}
.form-cab h2{margin:0;font-size:1.15rem}
.fechar{background:none;border:0;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--cinza);padding:4px 8px}
.form-corpo{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo.cheio{grid-column:1/-1}
.campo label{font-size:.88rem;font-weight:600;color:var(--cinza)}
.campo input,.campo select,.campo textarea{border:1px solid var(--linha);border-radius:8px;padding:11px 12px;background:#FAFBFC;width:100%;min-width:0;font-size:16px}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--asfalto);outline:none;box-shadow:0 0 0 3px rgba(242,183,5,.45)}
.form-pe{display:flex;gap:10px;align-items:center;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--linha)}
.form-pe .btn-pri{margin-left:auto}
.escolha{padding:20px;display:grid;gap:10px}
.escolha .btn{text-align:left;padding:16px}

/* toggle: verde ligado, vermelho desligado */
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;padding:6px 0}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .trilho{width:50px;height:28px;border-radius:999px;background:var(--gasto);position:relative;flex:none;transition:background .15s}
.toggle .trilho::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle input:checked + .trilho{background:var(--lucro)}
.toggle input:checked + .trilho::after{transform:translateX(22px)}
.toggle input:focus-visible + .trilho{outline:3px solid var(--sinal);outline-offset:2px}
.toggle .rot{font-weight:600}
.toggle .estado{display:block;font-size:.82rem;color:var(--cinza);font-weight:400}

/* login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--asfalto);padding:24px}
.login form{background:var(--papel);border-radius:14px;padding:28px 24px;width:100%;max-width:380px;display:grid;gap:14px}
.login h1{margin:0;font-family:var(--num);font-size:2rem}
.login p{margin:0;color:var(--cinza)}
.login .msg{color:var(--gasto);font-size:.9rem;min-height:1.2em}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--asfalto);color:#fff;padding:10px 18px;border-radius:999px;font-weight:500;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* v1.0.1: menu lateral, meta, comparação, dia da semana, fechar o dia */
.btn-menu{background:none;border:0;color:#fff;width:40px;height:40px;margin-left:-8px;border-radius:8px;cursor:pointer;display:grid;place-items:center;position:relative;flex:none}
.btn-menu:hover{background:var(--asfalto2)}
.btn-menu svg{width:24px;height:24px}
.btn-menu .ponto{position:absolute;top:6px;right:5px;width:10px;height:10px;border-radius:50%;background:var(--sinal);border:2px solid var(--asfalto)}
.veu{position:fixed;inset:0;background:rgba(31,38,45,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.veu.on{opacity:1;pointer-events:auto}
.gaveta{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--papel);z-index:41;transform:translateX(-100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.gaveta.on{transform:none;visibility:visible;transition:transform .22s ease,visibility 0s}
.gaveta-cab{background:var(--asfalto);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px 20px;display:flex;align-items:center;justify-content:space-between}
.gaveta-cab .fechar{color:#C9D1D8}
.gaveta-corpo{overflow-y:auto;flex:1;padding:0 20px 24px}
.cfg{padding:18px 0;border-bottom:1px solid var(--linha);display:grid;gap:12px}
.cfg:last-child{border-bottom:0}
.cfg h3{margin:0;font-size:1rem;font-weight:700}
.cfg p{margin:0;color:var(--cinza);font-size:.9rem}
.cfg .btn{width:100%}
.cfg .toggle{padding:0}
.versao{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.versao b{font-family:var(--num);font-size:1.25rem}
.nova{background:#FFF6D6;border-radius:8px;padding:10px 12px;color:#5C4A00;font-size:.92rem}
.btn-sinal{background:var(--sinal);color:var(--asfalto)}
.aviso-versao{background:var(--sinal);color:var(--asfalto);font-size:.92rem;font-weight:500;padding:8px 16px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.aviso-versao button{background:var(--asfalto);color:#fff;border:0;border-radius:999px;padding:5px 14px;font-weight:600;cursor:pointer}
.aviso-offline{background:#DDE3E9;color:var(--tinta);font-size:.88rem;padding:8px 16px;text-align:center}
.comparacao{display:inline-block;margin:-4px 0 16px;padding:4px 12px;border-radius:999px;font-size:.9rem;font-weight:600;background:var(--asfalto2);color:#C9D1D8}
.comparacao.sobe{color:#86E0AA}
.comparacao.desce{color:#FFA3A3}
.meta{background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:14px 16px;margin-top:16px}
.meta-topo{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.meta-topo span{color:var(--cinza);font-size:.9rem}
.meta-topo b{font-family:var(--num);font-size:1.35rem;font-weight:600}
.meta-barra{height:12px;background:var(--fundo);border-radius:6px;overflow:hidden;margin:10px 0 8px}
.meta-barra i{display:block;height:100%;background:var(--sinal);border-radius:6px}
.meta.batida .meta-barra i{background:var(--lucro)}
.meta p{margin:0;font-size:.95rem}
.semana li.melhor .valor{color:var(--lucro)}
.semana small{color:var(--cinza);font-size:.82rem;margin-left:6px}
.nota{color:var(--cinza);font-size:.85rem;margin:12px 0 0}
.grupo-app{grid-column:1/-1;border:1px solid var(--linha);border-radius:10px;padding:10px 12px 12px;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.grupo-app legend{font-weight:700;padding:0 6px}
.subtitulo{grid-column:1/-1;margin:4px 0 0;font-size:1rem;font-weight:700}
.btn-link{background:none;border:0;color:var(--asfalto);text-decoration:underline;font-weight:600;cursor:pointer;padding:6px 0;text-align:left}
.ou{grid-column:1/-1;text-align:center;color:var(--cinza);font-size:.9rem;margin:0}

@media (min-width:640px){
  .metricas{grid-template-columns:repeat(4,1fr)}
  .grupo-app{grid-template-columns:repeat(4,1fr)}
  dialog{border-radius:16px;margin:auto}
}
@media (min-width:900px){
  .abas{display:flex}
  nav.baixo{display:none}
  main{padding-bottom:60px}
  .fab{bottom:28px;right:28px}
  .toast{bottom:40px}
  .duas{grid-template-columns:1fr 1fr}
  .grafico{height:300px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- Tela de login (só aparece com Supabase configurado) -->
<section id="telaLogin" class="login hide">
  <form id="formLogin">
    <h1>Rodagem</h1>
    <p>Entre para ver seus ganhos e gastos.</p>
    <div class="campo"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="email" required></div>
    <div class="campo"><label for="lSenha">Senha</label><input id="lSenha" type="password" autocomplete="current-password" minlength="6" required></div>
    <div class="msg" id="lMsg"></div>
    <button class="btn btn-pri" type="submit">Entrar</button>
    <button class="btn btn-sec" type="button" id="btnCriar">Criar conta</button>
  </form>
</section>

<div id="app" class="hide">
  <header class="topo">
    <div class="topo-linha">
      <button class="btn-menu" id="btnMenu" type="button" aria-label="Abrir menu" aria-controls="gaveta" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="ponto hide" id="pontoMenu"></span></button>
      <div class="marca"><i></i>Rodagem</div>
      <div class="abas" id="abas"></div>
      <div class="topo-acoes">
        <button class="btn-icone" id="btnCsv" type="button">Exportar planilha</button>
      </div>
    </div>
    <div class="periodo" id="periodo" role="group" aria-label="Período">
      <button type="button" data-p="hoje">Hoje</button>
      <button type="button" data-p="semana">7 dias</button>
      <button type="button" data-p="mes">Este mês</button>
      <button type="button" data-p="mesant">Mês passado</button>
      <button type="button" data-p="ano">Este ano</button>
      <button type="button" data-p="custom" id="btnOutro">Outro período</button>
    </div>
  </header>
  <div class="aviso-demo hide" id="avisoDemo">Modo demonstração: os dados ficam só neste navegador. Configure o Supabase para salvar na nuvem.</div>
  <div class="aviso-versao hide" id="avisoVersao"></div>
  <div class="aviso-offline hide" id="avisoOffline">Sem internet. O que você lançar fica salvo no aparelho e sincroniza quando a conexão voltar.</div>
  <main id="conteudo"></main>
  <nav class="baixo" id="navBaixo"></nav>
  <button class="fab" id="fab" type="button" aria-label="Novo lançamento">+</button>
  <div class="veu" id="veu"></div>
  <aside class="gaveta" id="gaveta" aria-label="Menu e configurações"></aside>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== Configuração do Supabase =====
   Jeito recomendado: deixe as chaves no arquivo config.js (assim você troca o index.html
   em cada versão nova sem perder as chaves). Se preferir, ainda pode colar aqui embaixo. */
const CONFIG = (window.RODAGEM_CONFIG && window.RODAGEM_CONFIG.SUPABASE_URL) ? window.RODAGEM_CONFIG : {
  SUPABASE_URL: '',       // ex.: https://abcdefgh.supabase.co
  SUPABASE_ANON_KEY: ''   // Project Settings > API > anon public
};
/* ==================================================================== */
const APP_VERSION = '1.0.1';

const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
const sb = DEMO ? null : supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

const APPS = ['Uber','99','inDrive','Particular','Outro'];
const CATEGORIAS = ['Aluguel do carro','Parcela do carro','Manutenção','Lavagem','Seguro','IPVA e licenciamento','Alimentação','Celular e internet','Pedágio e estacionamento','Multas','Outros'];
const COMBUSTIVEIS = ['Gasolina','Etanol','GNV','Diesel'];
const CORES_APP = {Uber:'#26303A','99':'#F2B705',inDrive:'#5FA83A',Particular:'#4C7BD9',Outro:'#8A96A3'};

const ICONES = {
  painel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19a9 9 0 1 1 16 0"/><path d="M12 14l4-5"/></svg>',
  ganhos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>',
  gastos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg>',
  abastecimentos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14"/><path d="M3 20h12"/><path d="M14 10h2a2 2 0 0 1 2 2v4a1.5 1.5 0 0 0 3 0V9l-3-3"/><path d="M7 8h4"/></svg>'
};
const ABAS = [
  {id:'painel', nome:'Painel'},
  {id:'ganhos', nome:'Ganhos'},
  {id:'gastos', nome:'Gastos'},
  {id:'abastecimentos', nome:'Combustível'}
];

const estado = { aba:'painel', periodo:'mes', ganhos:[], gastos:[], abastecimentos:[],
  ini:null, fim:null, customTipo:null, dHoje:null, anterior:null, userId:null, email:'', cfg:null };
const CFG_PADRAO = { meta_diaria:0, mostrar_meta:true, apps_ativos:['Uber','99'], app_padrao:'Uber', periodo_inicial:'mes' };
let grafico = null;

/* ===== utilidades ===== */
const $ = s => document.querySelector(s);
const moeda = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const numero = (v,d=1) => (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const soma = (arr,f) => arr.reduce((t,r)=>t+(Number(f(r))||0),0);
const iso = d => { const z = new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const hoje = () => iso(new Date());
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function intervalo(p){
  const n = new Date(); let a = new Date(n), b = new Date(n);
  if(p==='semana'){ a.setDate(n.getDate()-6); }
  if(p==='mes'){ a = new Date(n.getFullYear(),n.getMonth(),1); b = new Date(n.getFullYear(),n.getMonth()+1,0); }
  if(p==='mesant'){ a = new Date(n.getFullYear(),n.getMonth()-1,1); b = new Date(n.getFullYear(),n.getMonth(),0); }
  if(p==='ano'){ a = new Date(n.getFullYear(),0,1); b = new Date(n.getFullYear(),11,31); }
  if(p==='custom' && estado.ini && estado.fim) return [estado.ini, estado.fim];
  return [iso(a), iso(b)];
}
// período anterior usado na comparação
function intervaloAnterior(p){
  const n = new Date(); const [a,b] = intervalo(p);
  const A = new Date(a+'T12:00:00'), B = new Date(b+'T12:00:00');
  if(p==='mes'){ const ult=new Date(n.getFullYear(),n.getMonth(),0).getDate(); return [iso(new Date(n.getFullYear(),n.getMonth()-1,1)), iso(new Date(n.getFullYear(),n.getMonth()-1,Math.min(n.getDate(),ult)))]; }
  if(p==='mesant' || (p==='custom' && estado.customTipo==='mes')) return [iso(new Date(A.getFullYear(),A.getMonth()-1,1)), iso(new Date(A.getFullYear(),A.getMonth(),0))];
  if(p==='ano'){ return [iso(new Date(n.getFullYear()-1,0,1)), iso(new Date(n.getFullYear()-1,n.getMonth(),n.getDate()))]; }
  const dias = Math.round((B-A)/864e5)+1;
  const fA = new Date(A); fA.setDate(fA.getDate()-dias); const fB = new Date(A); fB.setDate(fB.getDate()-1);
  return [iso(fA), iso(fB)];
}
const TEXTO_ANTERIOR = { hoje:'que ontem', semana:'que nos 7 dias anteriores', mes:'que no mesmo período do mês passado', mesant:'que no mês anterior', ano:'que no mesmo período do ano passado', custom:'que no período anterior' };
function agrupaPorMes(){ const [a,b]=intervalo(estado.periodo); return estado.periodo==='ano' || (new Date(b)-new Date(a))/864e5 > 62; }
function parseNum(v){
  let x=String(v??'').trim().replace(/\s|R\$/g,'');
  if(x.includes(',')) x=x.replace(/\./g,'').replace(',','.');
  if(x==='') return null; const n=Number(x); return isNaN(n) ? NaN : n;
}
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2200); }

/* ===== dados: Supabase ou navegador (demonstração) ===== */
const Local = {
  get(t){ try{ return JSON.parse(localStorage.getItem('rodagem_'+t)) || []; }catch(e){ return []; } },
  set(t,v){ try{ localStorage.setItem('rodagem_'+t, JSON.stringify(v)); }catch(e){} }
};
const ordenar = l => l.sort((x,y)=>y.data.localeCompare(x.data) || (y.created_at||'').localeCompare(x.created_at||''));
const ehErroRede = e => !navigator.onLine || /fetch|network|load failed|offline/i.test(String(e && (e.message||e)));
// cópia local do que veio da nuvem, para abrir o app sem internet
const Cache = {
  get(t){ return Local.get('cache_'+t); },
  set(t,v){ Local.set('cache_'+t,v); },
  trocarFaixa(t,a,b,rows){ this.set(t,[...this.get(t).filter(r=>r.data<a||r.data>b),...rows]); },
  gravar(t,r){ const l=this.get(t).filter(x=>x.id!==r.id); l.push(r); this.set(t,l); },
  remover(t,id){ this.set(t,this.get(t).filter(x=>x.id!==id)); }
};
// lançamentos feitos sem internet esperam aqui até sincronizar
const Fila = {
  get(){ return Local.get('fila'); },
  set(v){ Local.set('fila',v); atualizarPendentes(); },
  add(item){ const f=this.get(); f.push(item); this.set(f); },
  rodando:false,
  async processar(){
    if(DEMO || this.rodando || !navigator.onLine || !this.get().length) return;
    this.rodando=true;
    try{
      let f=this.get();
      while(f.length){
        const it=f[0];
        try{
          const {error} = it.op==='upsert' ? await sb.from(it.t).upsert(it.reg) : await sb.from(it.t).delete().eq('id',it.id);
          if(error) throw error;
        }catch(e){
          if(ehErroRede(e)) break;
          console.error(e); toast('Um lançamento pendente foi recusado: '+(e.message||''));
        }
        f.shift(); this.set(f);
      }
    } finally { this.rodando=false; }
  }
};
const DB = {
  async listar(t,a,b){
    if(DEMO) return ordenar(Local.get(t).filter(r=>r.data>=a && r.data<=b));
    try{
      await Fila.processar();
      const {data,error} = await sb.from(t).select('*').gte('data',a).lte('data',b).order('data',{ascending:false}).order('created_at',{ascending:false});
      if(error) throw error;
      const mapa = new Map(data.map(r=>[r.id,r]));
      Fila.get().forEach(i=>{ if(i.t!==t) return; if(i.op==='delete') mapa.delete(i.id); else if(i.reg.data>=a && i.reg.data<=b) mapa.set(i.reg.id,i.reg); });
      const rows=[...mapa.values()]; Cache.trocarFaixa(t,a,b,rows); return ordenar(rows);
    }catch(e){
      if(!ehErroRede(e)) throw e;
      return ordenar(Cache.get(t).filter(r=>r.data>=a && r.data<=b));
    }
  },
  async ultimo(t){
    if(DEMO) return ordenar(Local.get(t))[0] || null;
    try{ const {data,error}=await sb.from(t).select('*').order('data',{ascending:false}).order('created_at',{ascending:false}).limit(1); if(error) throw error; return data[0]||null; }
    catch(e){ return ordenar(Cache.get(t))[0] || null; }
  },
  async salvar(t,reg){
    if(DEMO){
      const todos = Local.get(t);
      if(reg.id){ const i=todos.findIndex(r=>r.id===reg.id); if(i>=0) todos[i]={...todos[i],...reg}; }
      else todos.push({...reg, id:uid(), created_at:new Date().toISOString()});
      Local.set(t,todos); return;
    }
    let r = {...reg};
    if(!r.id){ r.id=uid(); r.created_at=new Date().toISOString(); }
    else { const orig=Cache.get(t).find(x=>x.id===r.id) || estado[t].find(x=>x.id===r.id); if(orig) r={...orig,...r}; }
    if(estado.userId) r.user_id=estado.userId;
    Cache.gravar(t,r);
    try{
      if(!navigator.onLine) throw new Error('offline');
      const {error}=await sb.from(t).upsert(r); if(error) throw error;
    }catch(e){
      if(ehErroRede(e)){ Fila.add({op:'upsert',t,reg:r}); return 'fila'; }
      throw e;
    }
  },
  async excluir(t,id){
    if(DEMO){ Local.set(t, Local.get(t).filter(r=>r.id!==id)); return; }
    Cache.remover(t,id);
    try{
      if(!navigator.onLine) throw new Error('offline');
      const {error}=await sb.from(t).delete().eq('id',id); if(error) throw error;
    }catch(e){
      if(ehErroRede(e)){ Fila.add({op:'delete',t,id}); return 'fila'; }
      throw e;
    }
  }
};
// configurações: ficam na nuvem (valem em todos os aparelhos) com cópia local
const Cfg = {
  async carregar(){
    let c = null; try{ c = JSON.parse(localStorage.getItem('rodagem_cfg')); }catch(e){}
    estado.cfg = {...CFG_PADRAO, ...(c||{})};
    if(DEMO || !estado.userId) return;
    try{
      const {data,error}=await sb.from('configuracoes').select('dados').eq('user_id',estado.userId).maybeSingle();
      if(error) throw error;
      if(data && data.dados){ estado.cfg={...CFG_PADRAO,...data.dados}; this.local(); }
    }catch(e){ console.warn('configurações: usando cópia local', e); }
  },
  local(){ try{ localStorage.setItem('rodagem_cfg', JSON.stringify(estado.cfg)); }catch(e){} },
  async salvar(){
    this.local();
    if(DEMO || !estado.userId) return;
    try{ const {error}=await sb.from('configuracoes').upsert({user_id:estado.userId, dados:estado.cfg, atualizado_em:new Date().toISOString()}); if(error) throw error; }
    catch(e){ console.warn(e); if(!ehErroRede(e)) toast('Configuração salva só neste aparelho. Rode o SQL da versão 1.0.1 no Supabase.'); }
  }
};

/* ===== cálculos ===== */
function calcular(d=estado){
  const G=d.ganhos, X=d.gastos, A=d.abastecimentos;
  const bruto = soma(G,r=>Number(r.valor)+Number(r.gorjeta||0));
  const combustivel = soma(A,r=>r.valor);
  const outros = soma(X,r=>r.valor);
  const gastos = combustivel + outros;
  const lucro = bruto - gastos;
  const km = soma(G,r=>r.km), horas = soma(G,r=>r.horas), corridas = soma(G,r=>r.corridas);
  // consumo: diferença de odômetro entre o primeiro e o último abastecimento, dividida pelos litros colocados depois do primeiro
  const comOdo = A.filter(r=>Number(r.odometro)>0).sort((p,q)=>p.odometro-q.odometro);
  let kml = null;
  if(comOdo.length>=2){
    const rodado = comOdo[comOdo.length-1].odometro - comOdo[0].odometro;
    const litros = soma(comOdo.slice(1),r=>r.litros);
    if(litros>0 && rodado>0) kml = rodado/litros;
  }
  return {bruto,combustivel,outros,gastos,lucro,km,horas,corridas,kml};
}

/* ===== interface ===== */
function montarNavegacao(){
  $('#abas').innerHTML = ABAS.map(a=>`<button type="button" data-aba="${a.id}">${a.nome}</button>`).join('');
  $('#navBaixo').innerHTML = ABAS.map(a=>`<button type="button" data-aba="${a.id}">${ICONES[a.id]}<span>${a.nome}</span></button>`).join('');
  document.querySelectorAll('[data-aba]').forEach(b=>b.addEventListener('click',()=>{ estado.aba=b.dataset.aba; render(); window.scrollTo(0,0); }));
  document.querySelectorAll('#periodo button').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.p==='custom'){ abrirPeriodo(); return; } estado.periodo=b.dataset.p; carregar(); }));
}
function marcarAtivos(){
  document.querySelectorAll('[data-aba]').forEach(b=>b.setAttribute('aria-current', b.dataset.aba===estado.aba ? 'true':'false'));
  document.querySelectorAll('#periodo button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.p===estado.periodo ? 'true':'false'));
  if(estado.periodo!=='custom') $('#btnOutro').textContent='Outro período';
}

async function carregar(){
  const [a,b] = intervalo(estado.periodo);
  estado.anterior = null;
  try{
    const [g,x,ab] = await Promise.all([DB.listar('ganhos',a,b),DB.listar('gastos',a,b),DB.listar('abastecimentos',a,b)]);
    estado.ganhos=g; estado.gastos=x; estado.abastecimentos=ab;
  }catch(e){ console.error(e); toast('Não foi possível carregar. Confira a conexão.'); }
  render();
  // dados extras do painel: meta de hoje e comparação com o período anterior
  const h = hoje();
  try{
    if(h>=a && h<=b){ const f=r=>r.data===h; estado.dHoje={ganhos:estado.ganhos.filter(f),gastos:estado.gastos.filter(f),abastecimentos:estado.abastecimentos.filter(f)}; }
    else estado.dHoje = await buscar(h,h);
  }catch(e){ estado.dHoje=null; }
  try{ const [pa,pb]=intervaloAnterior(estado.periodo); estado.anterior = calcular(await buscar(pa,pb)); }
  catch(e){ estado.anterior=null; }
  if(estado.aba==='painel') render();
}
async function buscar(a,b){
  const [g,x,ab] = await Promise.all([DB.listar('ganhos',a,b),DB.listar('gastos',a,b),DB.listar('abastecimentos',a,b)]);
  return {ganhos:g,gastos:x,abastecimentos:ab};
}

function render(){
  marcarAtivos();
  if(grafico){ grafico.destroy(); grafico=null; }
  const c = $('#conteudo');
  if(estado.aba==='painel') c.innerHTML = htmlPainel();
  else c.innerHTML = htmlLista(estado.aba);
  if(estado.aba==='painel') desenharGrafico();
  c.querySelectorAll('[data-editar]').forEach(b=>b.addEventListener('click',()=>{
    const t=b.dataset.tabela; const reg=estado[t].find(r=>r.id===b.dataset.editar); abrirForm(t,reg);
  }));
  c.querySelectorAll('[data-novo]').forEach(b=>b.addEventListener('click',()=>abrirForm(b.dataset.novo)));
}

function htmlPainel(){
  const m = calcular();
  const porHora = m.horas>0 ? moeda(m.lucro/m.horas) : '–';
  const porKm = m.km>0 ? moeda(m.bruto/m.km) : '–';
  const custoKm = m.km>0 ? moeda(m.gastos/m.km)+' de custo' : '';
  const nada = !estado.ganhos.length && !estado.gastos.length && !estado.abastecimentos.length;

  // gastos por categoria (combustível entra como categoria)
  const cats = {};
  if(m.combustivel) cats['Combustível']=m.combustivel;
  estado.gastos.forEach(r=>{ cats[r.categoria]=(cats[r.categoria]||0)+Number(r.valor); });
  const listaCats = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const maxCat = listaCats.length ? listaCats[0][1] : 1;

  const apps = {};
  estado.ganhos.forEach(r=>{ apps[r.app]=(apps[r.app]||0)+Number(r.valor)+Number(r.gorjeta||0); });
  const listaApps = Object.entries(apps).sort((a,b)=>b[1]-a[1]);
  const maxApp = listaApps.length ? listaApps[0][1] : 1;

  return `
  <section class="estrada" aria-label="Resumo do período">
    <p>Lucro no período</p>
    <div class="lucro ${m.lucro<0?'neg':''}">${moeda(m.lucro)}</div>
    ${htmlComparacao(m)}
    <div class="partes">
      <div><span>Ganhos</span><b>${moeda(m.bruto)}</b></div>
      <div><span>Gastos</span><b>${moeda(m.gastos)}</b></div>
      <div><span>Km rodados</span><b>${numero(m.km,0)}</b></div>
    </div>
    <div class="faixa"></div>
  </section>
  ${htmlMeta()}

  <div class="metricas">
    <div class="metrica"><span>Lucro por hora</span><b>${porHora}</b><small>${m.horas?numero(m.horas,1)+' h online':''}</small></div>
    <div class="metrica"><span>Ganho por km</span><b>${porKm}</b><small>${custoKm}</small></div>
    <div class="metrica"><span>Consumo</span><b>${m.kml?numero(m.kml,1)+' km/l':'–'}</b><small>${m.kml?'':'precisa de 2 abastecimentos com odômetro'}</small></div>
    <div class="metrica"><span>Corridas</span><b>${numero(m.corridas,0)}</b><small>${m.corridas?moeda(m.bruto/m.corridas)+' por corrida':''}</small></div>
  </div>

  ${nada ? `<div class="bloco vazio">Nenhum lançamento neste período.<br><button class="btn btn-pri" type="button" data-novo="ganhos">Lançar o primeiro ganho</button></div>` : `
  ${estado.periodo!=='hoje' ? `<div class="bloco"><h2>Ganhos e gastos ${agrupaPorMes()?'por mês':'por dia'}</h2><div class="grafico"><canvas id="cv"></canvas></div></div>`:''}
  <div class="duas">
    <div class="bloco"><h2>Para onde foi o dinheiro</h2>${listaCats.length?`<ul class="barra-lista">${listaCats.map(([k,v])=>`<li><span>${esc(k)}</span><span class="valor">${moeda(v)}</span><span class="trilho"><i style="width:${(v/maxCat*100).toFixed(1)}%;background:var(--gasto)"></i></span></li>`).join('')}</ul>`:'<p class="vazio">Sem gastos no período.</p>'}</div>
    <div class="bloco"><h2>Ganhos por aplicativo</h2>${listaApps.length?`<ul class="barra-lista">${listaApps.map(([k,v])=>`<li><span>${esc(k)}</span><span class="valor">${moeda(v)}</span><span class="trilho"><i style="width:${(v/maxApp*100).toFixed(1)}%;background:${CORES_APP[k]||'#8A96A3'}"></i></span></li>`).join('')}</ul>`:'<p class="vazio">Sem ganhos no período.</p>'}</div>
  </div>
  ${htmlSemana()}`}`;
}

function htmlComparacao(m){
  const ant = estado.anterior; if(!ant) return '';
  if(!ant.bruto && !ant.gastos) return '';
  const dif = m.lucro - ant.lucro; const txt = estado.periodo==='custom' && estado.customTipo==='mes' ? 'que no mês anterior' : TEXTO_ANTERIOR[estado.periodo];
  if(Math.abs(dif) < 0.005) return `<div class="comparacao">Mesmo lucro ${txt}</div>`;
  const classe = dif>0 ? 'sobe' : 'desce';
  if(ant.lucro > 0){
    const pct = dif/ant.lucro*100;
    return `<div class="comparacao ${classe}">${dif>0?'▲':'▼'} ${numero(Math.abs(pct),0)}% ${dif>0?'a mais':'a menos'} ${txt}</div>`;
  }
  return `<div class="comparacao ${classe}">${dif>0?'▲':'▼'} ${moeda(Math.abs(dif))} ${dif>0?'a mais':'a menos'} ${txt}</div>`;
}

function htmlMeta(){
  const c = estado.cfg; if(!c || !c.mostrar_meta || !(Number(c.meta_diaria)>0) || !estado.dHoje) return '';
  const meta = Number(c.meta_diaria), lucro = calcular(estado.dHoje).lucro;
  const pct = Math.max(0, Math.min(100, lucro/meta*100)); const batida = lucro >= meta;
  const msg = batida ? `Meta batida. Você está ${moeda(lucro-meta)} acima.` : `Faltam <b>${moeda(meta-lucro)}</b> para bater a meta de hoje.`;
  return `<section class="meta ${batida?'batida':''}" aria-label="Meta de hoje">
    <div class="meta-topo"><span>Lucro de hoje</span><b>${moeda(lucro)} de ${moeda(meta)}</b></div>
    <div class="meta-barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct.toFixed(0)}"><i style="width:${pct.toFixed(1)}%"></i></div>
    <p>${msg}</p>
  </section>`;
}

function htmlSemana(){
  if(estado.periodo==='hoje') return '';
  const NOMES = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const d = NOMES.map(()=>({valor:0,horas:0,dias:new Set()}));
  estado.ganhos.forEach(r=>{ const w=new Date(r.data+'T12:00:00').getDay(); d[w].valor+=Number(r.valor)+Number(r.gorjeta||0); d[w].horas+=Number(r.horas)||0; d[w].dias.add(r.data); });
  const lista = d.map((x,i)=>({nome:NOMES[i],ph:x.horas>0?x.valor/x.horas:0,dias:x.dias.size})).filter(x=>x.ph>0);
  if(lista.length<2) return '';
  const max = Math.max(...lista.map(x=>x.ph));
  const ordem=[1,2,3,4,5,6,0].map(i=>NOMES[i]);
  lista.sort((a,b)=>ordem.indexOf(a.nome)-ordem.indexOf(b.nome));
  return `<div class="bloco"><h2>Ganho por hora em cada dia da semana</h2>
    <ul class="barra-lista semana">${lista.map(x=>`<li class="${x.ph===max?'melhor':''}"><span>${x.nome}<small>${x.dias} ${x.dias>1?'dias':'dia'}</small></span><span class="valor">${moeda(x.ph)}/h</span><span class="trilho"><i style="width:${(x.ph/max*100).toFixed(1)}%;background:${x.ph===max?'var(--lucro)':'var(--asfalto)'}"></i></span></li>`).join('')}</ul>
    <p class="nota">Média do que entrou por hora online nos dias do período. Quanto mais semanas no filtro, mais confiável.</p>
  </div>`;
}

function desenharGrafico(){
  const cv = document.getElementById('cv'); if(!cv || !window.Chart) return;
  const porMes = agrupaPorMes();
  const chave = d => porMes ? d.slice(0,7) : d;
  const [a,b] = intervalo(estado.periodo);
  const rotulos=[], chaves=[];
  if(porMes){ const d=new Date(a.slice(0,7)+'-01T12:00:00'), fim=new Date(b.slice(0,7)+'-01T12:00:00'); const varios=d.getFullYear()!==fim.getFullYear(); while(d<=fim){ chaves.push(iso(d).slice(0,7)); rotulos.push(MESES[d.getMonth()]+(varios?'/'+String(d.getFullYear()).slice(2):'')); d.setMonth(d.getMonth()+1); } }
  else { const d=new Date(a+'T12:00:00'), fim=new Date(b+'T12:00:00'); while(d<=fim){ const k=iso(d); chaves.push(k); rotulos.push(String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')); d.setDate(d.getDate()+1);} }
  const G=Object.fromEntries(chaves.map(k=>[k,0])), X=Object.fromEntries(chaves.map(k=>[k,0]));
  estado.ganhos.forEach(r=>{ const k=chave(r.data); if(k in G) G[k]+=Number(r.valor)+Number(r.gorjeta||0); });
  estado.gastos.forEach(r=>{ const k=chave(r.data); if(k in X) X[k]+=Number(r.valor); });
  estado.abastecimentos.forEach(r=>{ const k=chave(r.data); if(k in X) X[k]+=Number(r.valor); });
  grafico = new Chart(cv,{
    type:'bar',
    data:{labels:rotulos,datasets:[
      {label:'Ganhos',data:chaves.map(k=>G[k]),backgroundColor:'#1F8A50',borderRadius:3,maxBarThickness:22},
      {label:'Gastos',data:chaves.map(k=>X[k]),backgroundColor:'#C83E3E',borderRadius:3,maxBarThickness:22}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{font:{family:'Barlow',size:13},boxWidth:12}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+moeda(c.raw)}}},
      scales:{x:{grid:{display:false},ticks:{font:{family:'Barlow'},maxRotation:0,autoSkipPadding:8}},y:{grid:{color:'#E6EAEE'},ticks:{font:{family:'Barlow'},callback:v=>'R$ '+v.toLocaleString('pt-BR')}}}}
  });
}

function htmlLista(t){
  const lista = estado[t];
  const titulo = {ganhos:'Ganhos',gastos:'Gastos',abastecimentos:'Combustível'}[t];
  const total = t==='ganhos' ? soma(lista,r=>Number(r.valor)+Number(r.gorjeta||0)) : soma(lista,r=>r.valor);
  const rotNovo = {ganhos:'Lançar ganho',gastos:'Lançar gasto',abastecimentos:'Lançar abastecimento'}[t];
  if(!lista.length) return `<div class="lista-topo"><h1>${titulo}</h1></div><div class="bloco vazio">Nada lançado neste período.<br><button class="btn btn-pri" type="button" data-novo="${t}">${rotNovo}</button></div>`;
  let extra='';
  if(t==='abastecimentos'){ const l=soma(lista,r=>r.litros); extra = l?`<span>${numero(l,1)} litros, média ${moeda(total/l)}/l</span>`:''; }
  if(t==='gastos'){ const f=soma(lista.filter(r=>r.fixo),r=>r.valor); extra = f?`<span>${moeda(f)} em gastos fixos</span>`:''; }
  return `
  <div class="lista-topo"><h1>${titulo}</h1><div class="total"><span>Total</span><b class="${t==='ganhos'?'pos':'negv'}">${moeda(total)}</b>${extra}</div></div>
  <ul class="itens">${lista.map(r=>linha(t,r)).join('')}</ul>`;
}
function linha(t,r){
  const d = new Date(r.data+'T12:00:00');
  const dia = `<span class="dia"><b>${String(d.getDate()).padStart(2,'0')}</b>${MESES[d.getMonth()]}</span>`;
  let tt='', s='', v='';
  if(t==='ganhos'){
    tt=esc(r.app); const p=[];
    if(r.corridas) p.push(r.corridas+' corridas'); if(r.km) p.push(numero(r.km,0)+' km'); if(r.horas) p.push(numero(r.horas,1)+' h');
    if(Number(r.gorjeta)) p.push(moeda(r.gorjeta)+' de gorjeta');
    s=p.join(', '); v=`<span class="valor pos">${moeda(Number(r.valor)+Number(r.gorjeta||0))}</span>`;
  }
  if(t==='gastos'){ tt=esc(r.categoria)+(r.fixo?' (fixo)':''); s=esc(r.descricao||''); v=`<span class="valor negv">${moeda(r.valor)}</span>`; }
  if(t==='abastecimentos'){
    tt=esc(r.combustivel)+', '+numero(r.litros,1)+' l'; const p=[];
    if(Number(r.litros)) p.push(moeda(r.valor/r.litros)+'/l'); if(r.odometro) p.push(numero(r.odometro,0)+' km no painel'); if(r.posto) p.push(esc(r.posto));
    s=p.join(', '); v=`<span class="valor negv">${moeda(r.valor)}</span>`;
  }
  return `<li><button type="button" data-editar="${r.id}" data-tabela="${t}">${dia}<span><span class="t">${tt}</span><br><span class="s">${s}</span></span>${v}</button></li>`;
}

function abrirForm(t,reg){
  const d=$('#dlg'); const editando=!!reg;
  const v = reg ? {...reg} : {data:hoje(),...PADRAO[t]};
  if(!reg && t==='ganhos' && estado.cfg) v.app = estado.cfg.app_padrao || v.app;
  d.innerHTML = `<form id="fLanc" novalidate>
    <div class="form-cab"><h2>${editando?'Editar':'Novo'} ${TITULOS[t]}</h2><button class="fechar" type="button" aria-label="Fechar">&times;</button></div>
    <div class="form-corpo">${CAMPOS[t].map(c=>campoHtml(c,v[c.n])).join('')}</div>
    <div class="form-pe">${editando?'<button class="btn btn-del" type="button" id="btnExcluir">Excluir</button>':''}${!editando&&t==='ganhos'?'<button class="btn-link" type="button" id="btnRepetir">Repetir último</button>':''}<button class="btn btn-pri" type="submit">${editando?'Salvar alterações':'Salvar'}</button></div>
  </form>`;
  d.querySelector('.fechar').onclick=()=>d.close();
  d.querySelectorAll('.toggle input').forEach(i=>i.addEventListener('change',()=>{ i.closest('.toggle').querySelector('.estado').textContent = i.checked ? i.dataset.on : i.dataset.off; }));
  const f=d.querySelector('form');
  f.onsubmit = async e=>{
    e.preventDefault();
    const reg2 = editando ? {id:reg.id} : {};
    for(const c of CAMPOS[t]){
      const el=f.elements[c.n];
      if(c.tipo==='toggle') reg2[c.n]=el.checked;
      else if(c.tipo==='number'){
        let x=String(el.value).trim().replace(/\s|R\$/g,'');
        if(x.includes(',')) x=x.replace(/\./g,'').replace(',','.');
        if(x!=='' && isNaN(Number(x))){ el.focus(); toast('Número inválido em: '+c.r); return; }
        reg2[c.n]= x==='' ? null : Number(x);
      }
      else reg2[c.n]= el.value.trim() || null;
      if(c.req && (reg2[c.n]===null || reg2[c.n]==='')){ el.focus(); toast('Preencha: '+c.r); return; }
    }
    if(t==='ganhos'){ reg2.gorjeta = reg2.gorjeta||0; }
    try{ const r=await DB.salvar(t,reg2); d.close(); toast(r==='fila'?'Salvo no aparelho. Sincroniza quando a internet voltar.':(editando?'Alterações salvas':'Lançamento salvo')); carregar(); }
    catch(err){ console.error(err); toast('Erro ao salvar: '+(err.message||'tente de novo')); }
  };
  const br=d.querySelector('#btnRepetir');
  if(br) br.onclick = async ()=>{
    const u = await DB.ultimo('ganhos'); if(!u){ toast('Ainda não há ganho anterior.'); return; }
    ['app','corridas','km','horas'].forEach(k=>{ const el=f.elements[k]; if(el && u[k]!=null) el.value = k==='app' ? u[k] : String(u[k]).replace('.',','); });
    toast('Aplicativo, corridas, km e horas copiados. Falta o valor.'); f.elements.valor.focus();
  };
  const bx=d.querySelector('#btnExcluir');
  if(bx) bx.onclick = async ()=>{
    if(!confirm('Excluir este lançamento?')) return;
    try{ const r=await DB.excluir(t,reg.id); d.close(); toast(r==='fila'?'Excluído no aparelho. Sincroniza quando a internet voltar.':'Lançamento excluído'); carregar(); }
    catch(err){ toast('Erro ao excluir: '+(err.message||'')); }
  };
  if(!d.open) d.showModal();
}

        <div class="campo"><label for="d${i}_valor">Valor (R$)</label><input id="d${i}_valor" name="valor" inputmode="decimal" autocomplete="off"></div>

      </fieldset>`).join('')}
      <p class="subtitulo">Gastos do dia</p>
      <div class="campo"><label for="d_alim">Alimentação (R$)</label><input id="d_alim" name="alimentacao" inputmode="decimal" autocomplete="off"></div>
      <div class="campo"><label for="d_outro">Outro gasto (R$)</label><input id="d_outro" name="outro" inputmode="decimal" autocomplete="off"></div>
      <div class="campo cheio"><label for="d_cat">Categoria do outro gasto</label><select id="d_cat" name="categoria">${cat.map(c=>`<option ${c==='Outros'?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      <p class="nota cheio" style="grid-column:1/-1;margin:0">Deixe em branco o que não teve. Abastecimento continua no botão próprio, por causa dos litros e do km do painel.</p>
    </div>
    <div class="form-pe"><button class="btn btn-pri" type="submit">Salvar o dia</button></div>
  </form>`;
  d.querySelector('.fechar').onclick=()=>d.close();
  const f=d.querySelector('form');
  d.querySelector('#btnRepetirDia').onclick = async ()=>{
    const u = await DB.ultimo('ganhos'); if(!u){ toast('Ainda não há dia anterior.'); return; }
    const [g] = await Promise.all([DB.listar('ganhos',u.data,u.data)]);
    let n=0;
    f.querySelectorAll('.grupo-app').forEach(fs=>{ const r=g.find(x=>x.app===fs.dataset.app); if(!r) return; n++;
      ['km','horas'].forEach(k=>{ if(r[k]!=null) fs.querySelector(`[name="${k}"]`).value=String(r[k]).replace('.',','); }); });
    toast(n ? 'Horas e km copiados do dia '+u.data.split('-').reverse().slice(0,2).join('/') : 'Não achei esses aplicativos no último dia.');
  };
  f.onsubmit = async e=>{
    e.preventDefault();
    const data = f.elements.data.value; if(!data){ toast('Preencha a data'); return; }
    const regs=[];
    for(const fs of f.querySelectorAll('.grupo-app')){
      const v={}; for(const k of ['valor','corridas','km','horas']){ const el=fs.querySelector(`[name="${k}"]`); v[k]=parseNum(el.value); if(Number.isNaN(v[k])){ el.focus(); toast('Número inválido em '+fs.dataset.app); return; } }
      if(v.valor) regs.push(['ganhos',{data,app:fs.dataset.app,valor:v.valor,gorjeta:0,corridas:v.corridas,km:v.km,horas:v.horas}]);
      else if(v.corridas||v.km||v.horas){ fs.querySelector('[name="valor"]').focus(); toast('Falta o valor do '+fs.dataset.app); return; }
    }
    const alim=parseNum(f.elements.alimentacao.value), outro=parseNum(f.elements.outro.value);
    if(Number.isNaN(alim)||Number.isNaN(outro)){ toast('Confira os valores dos gastos'); return; }
    if(alim) regs.push(['gastos',{data,categoria:'Alimentação',valor:alim,fixo:false,descricao:null}]);
    if(outro) regs.push(['gastos',{data,categoria:f.elements.categoria.value,valor:outro,fixo:false,descricao:null}]);
    if(!regs.length){ toast('Preencha pelo menos um valor'); return; }
    let fila=false;
    try{ for(const [t,r] of regs){ if(await DB.salvar(t,r)==='fila') fila=true; } }
    catch(err){ console.error(err); toast('Erro ao salvar: '+(err.message||'tente de novo')); return; }
    d.close(); toast(fila?'Dia salvo no aparelho. Sincroniza quando a internet voltar.':`Dia fechado: ${regs.length} ${regs.length>1?'lançamentos salvos':'lançamento salvo'}`); carregar();
  };
  if(!d.open) d.showModal();
}

  };
  if(!d.open) d.showModal();
}

      <p>Aparecem no "Fechar o dia".</p>
      ${APPS.map((a,i)=>toggleHtml('c_app'+i,a,c.apps_ativos.includes(a),'Ligado','Desligado')).join('')}
      <div class="campo"><label for="c_padrao">Aplicativo padrão no lançamento</label><select id="c_padrao">${APPS.map(a=>`<option ${a===c.app_padrao?'selected':''}>${esc(a)}</option>`).join('')}</select></div>
    </section>
    <section class="cfg"><h3>Ao abrir o app</h3>
      <div class="campo"><label for="c_per">Mostrar o período</label><select id="c_per">${Object.entries(per).map(([k,v])=>`<option value="${k}" ${k===c.periodo_inicial?'selected':''}>${v}</option>`).join('')}</select></div>
    </section>
    ${DEMO?'':`<section class="cfg"><h3>Sincronização</h3>
      <p>${pend ? `${pend} ${pend>1?'lançamentos aguardando':'lançamento aguardando'} internet para subir.` : 'Tudo sincronizado com a nuvem.'}</p>
      ${pend?'<button class="btn btn-sec" type="button" id="c_sync">Sincronizar agora</button>':''}
    </section>`}
    <section class="cfg"><h3>Instalar no aparelho</h3>
      ${pedidoInstalar ? '<button class="btn btn-sec" type="button" id="c_instalar">Instalar o Rodagem</button>' : `<p>${window.matchMedia('(display-mode: standalone)').matches ? 'O app já está instalado neste aparelho.' : 'No Android: menu ⋮ do Chrome, Adicionar à tela inicial. No iPhone: botão compartilhar do Safari, Adicionar à Tela de Início.'}</p>`}
    </section>
    <section class="cfg"><h3>Versão</h3>
      <div class="versao"><span>Instalada</span><b>${APP_VERSION}</b></div>
      ${(swEsperando||novaVersao) ? `<div class="nova">Nova versão disponível${novaVersao?': <b>'+esc(novaVersao)+'</b>':''}.</div><button class="btn btn-sinal" type="button" id="c_atualizar">Atualizar agora</button>` : '<button class="btn btn-sec" type="button" id="c_verificar">Verificar atualização</button>'}
    </section>
    <section class="cfg"><h3>Conta</h3>
      <p>${DEMO ? 'Modo demonstração, sem conta.' : esc(estado.email||'')}</p>
      ${DEMO ? '' : '<button class="btn btn-sec" type="button" id="btnSair">Sair</button>'}
    </section>
  </div>`;
  g.querySelector('.fechar').onclick = fecharMenu;
  g.querySelectorAll('.toggle input').forEach(i=>i.addEventListener('change',()=>{ i.closest('.toggle').querySelector('.estado').textContent = i.checked ? i.dataset.on : i.dataset.off; }));
  const salvar = async ()=>{ await Cfg.salvar(); toast('Configuração salva'); if(estado.aba==='painel') render(); };
  g.querySelector('#c_meta').addEventListener('change',e=>{ const n=parseNum(e.target.value); if(Number.isNaN(n)){ toast('Valor da meta inválido'); return; } estado.cfg.meta_diaria=n||0; salvar(); });
  g.querySelector('#c_mostrar').addEventListener('change',e=>{ estado.cfg.mostrar_meta=e.target.checked; salvar(); });
  APPS.forEach((a,i)=>g.querySelector('#c_app'+i).addEventListener('change',e=>{
    const set=new Set(estado.cfg.apps_ativos); e.target.checked?set.add(a):set.delete(a);
    if(!set.size){ e.target.checked=true; e.target.dispatchEvent(new Event('change')); toast('Deixe pelo menos um aplicativo ligado'); return; }
    estado.cfg.apps_ativos=APPS.filter(x=>set.has(x)); salvar(); }));
  g.querySelector('#c_padrao').addEventListener('change',e=>{ estado.cfg.app_padrao=e.target.value; salvar(); });
  g.querySelector('#c_per').addEventListener('change',e=>{ estado.cfg.periodo_inicial=e.target.value; salvar(); });
  const bs=g.querySelector('#c_sync'); if(bs) bs.onclick=async()=>{ if(!navigator.onLine){ toast('Ainda sem internet'); return; } await Fila.processar(); renderGaveta(); carregar(); toast(Fila.get().length?'Alguns lançamentos ainda não subiram':'Tudo sincronizado'); };
  const bi=g.querySelector('#c_instalar'); if(bi) bi.onclick=async()=>{ pedidoInstalar.prompt(); await pedidoInstalar.userChoice; pedidoInstalar=null; renderGaveta(); };
  const bv=g.querySelector('#c_verificar'); if(bv) bv.onclick=verificarAtualizacao;
  const ba=g.querySelector('#c_atualizar'); if(ba) ba.onclick=aplicarAtualizacao;
  const bsair=g.querySelector('#btnSair'); if(bsair) bsair.onclick=async()=>{ await sb.auth.signOut(); ['cache_ganhos','cache_gastos','cache_abastecimentos','cfg'].forEach(k=>localStorage.removeItem('rodagem_'+k)); location.reload(); };
}
function atualizarPendentes(){
  const temAviso = !!(swEsperando||novaVersao) || Fila.get().length>0;
  const p=$('#pontoMenu'); if(p) p.classList.toggle('hide',!temAviso);
  if($('#gaveta') && $('#gaveta').classList.contains('on')) renderGaveta();
}
function mostrarAvisoVersao(){
  const el=$('#avisoVersao');
  el.innerHTML = `<span>Nova versão do Rodagem disponível${novaVersao?' ('+esc(novaVersao)+')':''}.</span><button type="button" id="btnAvisoAtualizar">Atualizar agora</button>`;
  el.classList.remove('hide'); el.querySelector('button').onclick=aplicarAtualizacao;
  atualizarPendentes();
}
async function lerVersaoPublicada(){
  const txt = await (await fetch('index.html?v='+Date.now(),{cache:'no-store'})).text();
  const m = txt.match(/APP_VERSION\s*=\s*'([^']+)'/); return m ? m[1] : null;
}
async function avisarAtualizacao(worker){
  swEsperando = worker;
  try{ const v=await lerVersaoPublicada(); if(v && v!==APP_VERSION) novaVersao=v; }catch(e){}
  mostrarAvisoVersao();
}
async function verificarAtualizacao(){
  if(!navigator.onLine){ toast('Sem internet para verificar'); return; }
  toast('Procurando atualização...');
  try{
    if(swReg){ await swReg.update(); if(swReg.waiting){ await avisarAtualizacao(swReg.waiting); return; } if(swReg.installing){ toast('Baixando a nova versão...'); return; } }
    const v = await lerVersaoPublicada();
    if(v && v!==APP_VERSION){ novaVersao=v; mostrarAvisoVersao(); }
    else toast('Você já está na versão mais recente ('+APP_VERSION+')');
  }catch(e){ toast('Não foi possível verificar agora'); }
}
async function aplicarAtualizacao(){
  if(swEsperando){ swEsperando.postMessage('SKIP_WAITING'); return; }
  // sem service worker esperando: limpa o que está guardado e recarrega a versão publicada
  try{ if('caches' in window){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } if(swReg) await swReg.unregister(); }catch(e){}
  location.reload();
}
function iniciarPWA(){
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); pedidoInstalar=e; });
  const offline=()=>$('#avisoOffline').classList.toggle('hide',navigator.onLine);
  window.addEventListener('online',()=>{ offline(); Fila.processar().then(()=>{ if(!$('#app').classList.contains('hide')) carregar(); }); });
  window.addEventListener('offline',offline); offline();
  if(!('serviceWorker' in navigator) || !location.protocol.startsWith('http')) return;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    swReg=reg;
    if(reg.waiting && navigator.serviceWorker.controller) avisarAtualizacao(reg.waiting);
    reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw) return;
      nw.addEventListener('statechange',()=>{ if(nw.state==='installed' && navigator.serviceWorker.controller) avisarAtualizacao(nw); }); });
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
  }).catch(e=>console.warn('service worker', e));
  let recarregando=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(recarregando) return; recarregando=true; location.reload(); });
}

/* ===== exportar planilha (CSV que abre no Excel e no Google Planilhas) ===== */
function exportar(){
  const n = v => v==null||v==='' ? '' : String(v).replace('.',',');
  const q = s => '"'+String(s??'').replace(/"/g,'""')+'"';
  const linhas=[['Tipo','Data','Descrição','Valor','Gorjeta','Corridas','Km','Horas','Litros','Km no painel','Fixo / Tanque cheio']];
  estado.ganhos.forEach(r=>linhas.push(['Ganho',r.data,q(r.app+(r.obs?' - '+r.obs:'')),n(r.valor),n(r.gorjeta),n(r.corridas),n(r.km),n(r.horas),'','','']));
  estado.abastecimentos.forEach(r=>linhas.push(['Combustível',r.data,q(r.combustivel+(r.posto?' - '+r.posto:'')),n(-r.valor),'','','','',n(r.litros),n(r.odometro),r.tanque_cheio?'Sim':'Não']));
  estado.gastos.forEach(r=>linhas.push(['Gasto',r.data,q(r.categoria+(r.descricao?' - '+r.descricao:'')),n(-r.valor),'','','','','','',r.fixo?'Sim':'Não']));
  const csv='\ufeff'+linhas.map(l=>l.join(';')).join('\r\n');
  const [a,b]=intervalo(estado.periodo);
  const link=document.createElement('a');
  link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  link.download=`rodagem_${a}_a_${b}.csv`; document.body.appendChild(link); link.click(); link.remove();
}

/* ===== início e login ===== */
async function entrarNoApp(){
  $('#telaLogin').classList.add('hide'); $('#app').classList.remove('hide');
  await Cfg.carregar();
  estado.periodo = estado.cfg.periodo_inicial || 'mes';
  atualizarPendentes();
  carregar();
}
async function iniciar(){
  montarNavegacao();
  $('#fab').onclick = ()=>{ estado.aba==='painel' ? abrirEscolha() : abrirForm(estado.aba); };
  $('#btnCsv').onclick = exportar;
  $('#btnMenu').onclick = abrirMenu; $('#veu').onclick = fecharMenu;
  document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#gaveta').classList.contains('on')) fecharMenu(); });
  iniciarPWA();
  if(DEMO){ semearDemo(); $('#avisoDemo').classList.remove('hide'); entrarNoApp(); return; }

  const msg=$('#lMsg');
  $('#formLogin').onsubmit = async e=>{
    e.preventDefault(); msg.textContent='';
    const {error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lSenha').value});
    if(error) msg.textContent = error.message.includes('Invalid') ? 'E-mail ou senha incorretos.' : error.message;
  };
  $('#btnCriar').onclick = async ()=>{
    msg.textContent='';
    const email=$('#lEmail').value.trim(), senha=$('#lSenha').value;
    if(!email || senha.length<6){ msg.textContent='Informe e-mail e senha com pelo menos 6 caracteres.'; return; }
    const {data,error}=await sb.auth.signUp({email,password:senha});
    if(error){ msg.textContent=error.message; return; }
    if(!data.session){ msg.style.color='var(--lucro)'; msg.textContent='Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.'; }
  };
  const {data:{session}} = await sb.auth.getSession();
  const guardar = s => { if(s && s.user){ estado.userId=s.user.id; estado.email=s.user.email||''; } };
  guardar(session);
  if(session) entrarNoApp(); else $('#telaLogin').classList.remove('hide');
  sb.auth.onAuthStateChange((ev,s)=>{ guardar(s); if(ev==='SIGNED_IN' && $('#app').classList.contains('hide')) entrarNoApp(); });
}
iniciar();
</script>
